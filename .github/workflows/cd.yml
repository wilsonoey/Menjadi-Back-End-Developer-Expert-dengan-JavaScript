name: Continuous Deployment

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_AUTH_TOKEN || secrets.TOKEN_VERCEL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel using Vercel CLI..."
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN || true
            vercel build --prod --token=$VERCEL_TOKEN || true
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN || vercel deploy --prod --token=$VERCEL_TOKEN --yes
          else
            echo "VERCEL_TOKEN not provided in secrets. Deployment is managed via Vercel Git Integration."
          fi
