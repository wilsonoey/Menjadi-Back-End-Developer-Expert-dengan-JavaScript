name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGHOST: ${{ secrets.PGHOST_TEST || 'localhost' }}
          PGUSER: ${{ secrets.PGUSER_TEST || 'postgres' }}
          PGPASSWORD: ${{ secrets.PGPASSWORD_TEST || 'postgrespassword' }}
          PGDATABASE: ${{ secrets.PGDATABASE_TEST || 'postgres_test' }}
          PGPORT: ${{ secrets.PGPORT_TEST || '5432' }}
        run: npm run migrate

      - name: Run automated tests
        env:
          NODE_ENV: test
          PGHOST: ${{ secrets.PGHOST || 'localhost' }}
          PGUSER: ${{ secrets.PGUSER || 'postgres' }}
          PGPASSWORD: ${{ secrets.PGPASSWORD || 'postgrespassword' }}
          PGDATABASE: ${{ secrets.PGDATABASE || 'postgres_test' }}
          PGPORT: ${{ secrets.PGPORT || '5432' }}
          PGHOST_TEST: ${{ secrets.PGHOST_TEST || 'localhost' }}
          PGUSER_TEST: ${{ secrets.PGUSER_TEST || 'postgres' }}
          PGPASSWORD_TEST: ${{ secrets.PGPASSWORD_TEST || 'postgrespassword' }}
          PGDATABASE_TEST: ${{ secrets.PGDATABASE_TEST || 'postgres_test' }}
          PGPORT_TEST: ${{ secrets.PGPORT_TEST || '5432' }}
          ACCESS_TOKEN_KEY: ${{ secrets.ACCESS_TOKEN_KEY || '8b7b4ef375716ab08b2a3951b29d52fc00b1c855f9d1a847229b8c5935bef56d9d271e76a9cf08e614300395c3b90ebe559cf968a0741b18c9505549394b2c70' }}
          REFRESH_TOKEN_KEY: ${{ secrets.REFRESH_TOKEN_KEY || '5078605e074a462b1460608fcbe0d0963c644402e04ad334455ff5a856cb43fd99825861dde02957d5e3184c90c532ca7d0249df20fe93d535632f3d11be7bad' }}
          ACCCESS_TOKEN_AGE: ${{ secrets.ACCCESS_TOKEN_AGE || '3000' }}
        run: npx jest --runInBand --setupFiles dotenv/config
